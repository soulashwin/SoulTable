name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A8A7B8: ${{ secrets.A8A7B8 }}
          B4BE57: ${{ secrets.B4BE57 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A8A7B8', '')
          bm = os.environ.get('B4BE57', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- fc6d597f458b69de8caaed08 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 09a4ffd0523c07507204bd2e4bd91617a651ed -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
